# Place at: .github/workflows/build-unsigned-ipa.yml (in the Lume repo root)
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme (leave blank to auto-detect)"
        required: false
        default: ""
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            sdk: iphoneos
            dest: "generic/platform=iOS"
            products: Release-iphoneos
          - platform: tvOS
            sdk: appletvos
            dest: "generic/platform=tvOS"
            products: Release-appletvos

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create .env from repo secrets (all optional)
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          INTRO_DB_API_KEY: ${{ secrets.INTRO_DB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
        run: |
          : > .env
          for k in TMDB_ACCESS_TOKEN MDBLIST_API_KEY INTRO_DB_API_KEY OPENSUBTITLES_API_KEY \
                   TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID SIMKL_CLIENT_SECRET MDBLIST_CLIENT_ID; do
            echo "$k=${!k}" >> .env
          done

      - name: Resolve scheme
        id: scheme
        run: |
          S="${{ github.event.inputs.scheme }}"
          if [ -z "$S" ]; then
            S=$(xcodebuild -list -json -project Lume.xcodeproj | jq -r '.project.schemes[]' | grep -ix 'lume' | head -1)
            [ -z "$S" ] && S=$(xcodebuild -list -json -project Lume.xcodeproj | jq -r '.project.schemes[0]')
          fi
          echo "Using scheme: $S"
          echo "name=$S" >> "$GITHUB_OUTPUT"

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Lume.xcodeproj \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk ${{ matrix.sdk }} \
            -destination "${{ matrix.dest }}" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcpretty || exit 1

      - name: Package unsigned .ipa
        run: |
          APP=$(find build/Build/Products/${{ matrix.products }} -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Lume-${{ matrix.platform }}-unsigned.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lume-${{ matrix.platform }}-unsigned-ipa
          path: Lume-${{ matrix.platform }}-unsigned.ipa
