# Place at: .github/workflows/build-unsigned-ipa.yml (replace the old file)
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme (leave blank to auto-detect)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            sdk: iphoneos
            dest: "generic/platform=iOS"
          - platform: tvOS
            sdk: appletvos
            dest: "generic/platform=tvOS"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Fetch all sibling local packages (auto-detected from Lume.xcodeproj)
        run: |
          REPOS=$(grep -oE 'relativePath = "?\.\./[A-Za-z0-9._-]+' Lume.xcodeproj/project.pbxproj \
                  | sed -E 's#.*\.\./##' | sort -u)
          REPOS=$(printf "%s\nLumeRecorder\nLumeCloud\n" "$REPOS" | grep -v '^$' | sort -u)
          echo "Sibling repos needed:"; echo "$REPOS"
          for R in $REPOS; do
            if [ -d "../$R" ]; then echo "../$R already present"; continue; fi
            echo "Cloning bilipp/$R ..."
            git clone --depth 1 "https://github.com/bilipp/$R.git" "../$R" \
              || echo "::warning::Could not clone bilipp/$R"
          done
          ls -la ..

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Show repo layout (debug)
        run: |
          pwd
          ls -la

      - name: Create .env from repo secrets (all optional)
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          INTRO_DB_API_KEY: ${{ secrets.INTRO_DB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
        run: |
          : > .env
          for k in TMDB_ACCESS_TOKEN MDBLIST_API_KEY INTRO_DB_API_KEY OPENSUBTITLES_API_KEY \
                   TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID SIMKL_CLIENT_SECRET MDBLIST_CLIENT_ID; do
            echo "$k=${!k}" >> .env
          done

      - name: Resolve scheme
        id: scheme
        run: |
          xcodebuild -list -project Lume.xcodeproj
          S="${{ github.event.inputs.scheme }}"
          if [ -z "$S" ]; then
            S=$(xcodebuild -list -json -project Lume.xcodeproj | python3 -c 'import json,sys; s=json.load(sys.stdin)["project"]["schemes"]; print(next((x for x in s if x.lower()=="lume"), s[0]))')
          fi
          echo "Using scheme: $S"
          echo "name=$S" >> "$GITHUB_OUTPUT"

      - name: Build (no code signing)
        run: |
          build() {
            xcodebuild \
              -project Lume.xcodeproj \
              -scheme "${{ steps.scheme.outputs.name }}" \
              -configuration Release \
              -sdk ${{ matrix.sdk }} \
              -destination "${{ matrix.dest }}" \
              -derivedDataPath build \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              "$@" \
              build > "$LOG" 2>&1
            grep -nE "error:|BUILD (SUCCEEDED|FAILED)" "$LOG" || true
            grep -q "BUILD SUCCEEDED" "$LOG"
          }

          # Attempt 1: normal optimised Release build
          LOG=build.log
          if build; then exit 0; fi

          # Attempt 2: the Swift optimiser crashed last time (EarlyPerfInliner on
          # HueSourceRouter deinit). Rebuild with Swift optimisation turned off.
          echo "::warning::Optimised build failed - retrying with SWIFT_OPTIMIZATION_LEVEL=-Onone"
          LOG=build-onone.log
          build SWIFT_OPTIMIZATION_LEVEL=-Onone

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: build*.log
          if-no-files-found: ignore

      - name: Package unsigned .ipa
        run: |
          APP=$(find build/Build/Products/Release-${{ matrix.sdk }} -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          [ -n "$APP" ] || { echo "No .app found"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Lume-${{ matrix.platform }}-unsigned.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lume-${{ matrix.platform }}-unsigned-ipa
          path: Lume-${{ matrix.platform }}-unsigned.ipa
